name: Build

# Windows-only project - the agent talks to WinSpool and Windows Credential
# Manager via JNA, and javax.print's Windows print-service backend, so this
# must run on windows-latest. There is nothing meaningful to build on Linux
# or macOS runners here.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: .\gradlew.bat compileKotlin test --console=plain
        shell: pwsh

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7

      # No WiX Toolset on the hosted runner, so this produces the app-image
      # (a standalone folder bundling its own JRE) rather than an MSI/EXE
      # installer - see build.gradle.kts's jpackageMsi task for that variant.
      - name: Package app image
        run: .\gradlew.bat jpackageAppImage --console=plain
        shell: pwsh

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: PrintlyAgent-app-image
          path: build/jpackage/PrintlyAgent
          retention-days: 7
